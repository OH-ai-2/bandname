<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日系六字乐队名生成器</title>
<style>
  :root {
    --bg: #0e0f14;
    --bg-2: #15161f;
    --card: rgba(255,255,255,0.045);
    --card-border: rgba(255,255,255,0.09);
    --text: #e9e6e1;
    --muted: #8b8a94;
    --accent: #f0a35e;
    --accent-soft: rgba(240,163,94,0.16);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 700px at 50% -10%, #1d1f2b 0%, transparent 60%),
      radial-gradient(900px 600px at 85% 110%, #1a1b26 0%, transparent 55%),
      linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 80px;
  }

  .wrap { width: 100%; max-width: 720px; }

  header { text-align: center; margin-bottom: 34px; }
  .kicker {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.35em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-left: 0.35em;
  }
  h1 {
    font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: 0.06em;
  }
  .sub { margin-top: 10px; color: var(--muted); font-size: 14px; letter-spacing: 0.08em; }

  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 30px 30px 26px;
    backdrop-filter: blur(12px);
    box-shadow: 0 30px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: -40% -20%;
    background: radial-gradient(400px 300px at 30% 0%, var(--accent-soft), transparent 70%);
    pointer-events: none;
  }

  /* ---------- genre chips ---------- */
  .genres {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    justify-content: center;
    margin-bottom: 26px;
  }
  .genre {
    font: inherit;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: var(--muted);
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 999px;
    padding: 7px 15px;
    cursor: pointer;
    transition: color .18s, border-color .18s, background .18s, transform .12s;
  }
  .genre:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
  .genre:active { transform: scale(0.96); }
  .genre.active {
    color: #191612;
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 6px 18px rgba(240,163,94,0.28);
  }

  /* ---------- stage ---------- */
  .stage { position: relative; text-align: center; padding: 18px 0 14px; }
  .genre-tag {
    font-size: 12px;
    letter-spacing: 0.22em;
    color: var(--accent);
    margin-bottom: 16px;
    opacity: 0;
    transition: opacity .3s;
  }
  .genre-tag.show { opacity: 1; }
  .name {
    font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    font-weight: 600;
    font-size: clamp(40px, 9vw, 60px);
    letter-spacing: 0.1em;
    line-height: 1.15;
    cursor: pointer;
    user-select: none;
    transition: color .2s;
    text-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  .name:hover { color: var(--accent); }
  .name.anim { animation: pop .38s cubic-bezier(.2,.7,.3,1.2); }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(10px) scale(0.97); filter: blur(3px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  .breakdown {
    margin-top: 12px;
    font-size: 13px;
    letter-spacing: 0.28em;
    color: var(--muted);
  }
  .breakdown b { font-weight: 400; color: #c9c6c1; }
  .hint { margin-top: 8px; font-size: 11px; color: #5c5b64; letter-spacing: 0.1em; }

  /* ---------- story ---------- */
  .story {
    position: relative;
    margin-top: 18px;
    text-align: left;
    font-size: 14px;
    line-height: 1.9;
    color: #b9b6b1;
    letter-spacing: 0.02em;
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    padding: 16px 18px 14px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .4s, transform .4s, border-color .2s, background .2s;
  }
  .story.show { opacity: 1; transform: translateY(0); }
  .story:hover { border-color: rgba(240,163,94,0.4); background: rgba(0,0,0,0.28); }
  .story-label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .story-tip {
    display: block;
    margin-top: 10px;
    font-size: 11px;
    color: #5c5b64;
    letter-spacing: 0.08em;
    text-align: right;
  }

  /* ---------- actions ---------- */
  .actions {
    position: relative;
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 20px;
  }
  button.btn {
    font: inherit;
    font-size: 15px;
    letter-spacing: 0.12em;
    border: none;
    cursor: pointer;
    border-radius: 12px;
    padding: 13px 30px;
    transition: transform .12s, box-shadow .2s, background .2s, color .2s;
  }
  button.btn:active { transform: translateY(1px) scale(0.98); }
  .btn-primary {
    color: #1a1713;
    background: linear-gradient(180deg, #f7b678, #ee9c50);
    box-shadow: 0 10px 26px rgba(240,163,94,0.32);
  }
  .btn-primary:hover { box-shadow: 0 14px 34px rgba(240,163,94,0.42); }
  .btn-ghost {
    color: var(--text);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.22); }

  /* ---------- history ---------- */
  .history { margin-top: 30px; }
  .history-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.18em;
  }
  .history-clear {
    background: none; border: none;
    color: #5c5b64; font: inherit; font-size: 12px;
    cursor: pointer; letter-spacing: 0.1em;
  }
  .history-clear:hover { color: var(--text); }
  .history-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .history-grid:empty::after {
    content: "还没有生成过，点上面的按钮试试";
    color: #4d4c55; font-size: 13px; letter-spacing: 0.05em;
  }
  .chip {
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    font-size: 14px;
    letter-spacing: 0.05em;
    color: #cfccc7;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .chip:hover { border-color: rgba(240,163,94,0.5); background: rgba(240,163,94,0.07); }
  .chip:active { transform: scale(0.96); }
  .chip small { color: #7a7883; margin-left: 6px; font-family: inherit; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 50%; bottom: 32px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(20,21,28,0.94);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text);
    font-size: 13px;
    letter-spacing: 0.08em;
    padding: 10px 20px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer { margin-top: 40px; color: #4d4c55; font-size: 12px; letter-spacing: 0.06em; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="kicker">NAMAE · GENERATOR</span>
      <h1>六字乐队名生成器</h1>

      </div>

      <div class="story" id="story" title="点击复制完整介绍"></div>

      <div class="actions">
        <button class="btn btn-primary" id="btn-gen">再生成一个</button>
        <button class="btn btn-ghost" id="btn-copy">复制名字</button>
      </div>
    </section>

    <section class="history">
      <div class="history-head">
        <span>最近生成</span>
        <button class="history-clear" id="btn-clear">清空</button>
      </div>
      <div class="history-grid" id="history"></div>
    </section>

    <footer>概念 × 修饰 × 地点 ＝ 日系乐队名</footer>
  </div>

  <div class="toast" id="toast">已复制</div>

  var currentGenre = "全部";
  var last = "";
  var lastCombo = [];
  var lastGenre = null;
  var lastShowGenre = true;
  var lastStoryPlain = "";

  var elName = document.getElementById("name");
  var elBreakdown = document.getElementById("breakdown");
  var elGenreTag = document.getElementById("genre-tag");
  var elStory = document.getElementById("story");
  var elGenres = document.getElementById("genres");
  var elHistory = document.getElementById("history");
  var elToast = document.getElementById("toast");
  var btnGen = document.getElementById("btn-gen");
  var btnCopy = document.getElementById("btn-copy");
  var btnClear = document.getElementById("btn-clear");

  var HISTORY_KEY = "bandname_history_v4";

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function pickGenre() {
    if (currentGenre === "全部") return pick(GENRES);
    return GENRES.filter(function (g) { return g.name === currentGenre; })[0];
  }

  function pickWord(list, used) {
    for (var i = 0; i < 24; i++) {
      var w = pick(list);
      if (used.indexOf(w[0]) === -1) return w;
    }
    return pick(list);
  }

  function fill(tpl, map) {
    Object.keys(map).forEach(function (k) { tpl = tpl.split(k).join(map[k]); });
    return tpl;
  }

  function generate() {
    var g = pickGenre();
    var used = [];
    var a = pickWord(g.first, used); used.push(a[0]);
    var b = pickWord(g.second, used); used.push(b[0]);
    var c = pickWord(g.third, used);

    var generic = (currentGenre === "全部");
    lastGenre = g;
    lastShowGenre = !generic;
    lastCombo = [a, b, c];
    last = a[0] + b[0] + c[0];
    lastStoryPlain = buildStory(g, a, b, c, last, generic);

    render();
    pushHistory();
  }

  function buildStory(g, a, b, c, name, generic) {
    var map = {
      "{name}": name,
      "{a}": a[0], "{a.g}": a[1],
      "{b}": b[0], "{b.g}": b[1],
      "{c}": c[0], "{c.g}": c[1]
    };
    var opening = generic ? pick(GENERIC_OPENINGS) : pick(g.opening);
    var weave = fill(pick(WEAVES), map);
    var origin = pick(g.origin);
    return opening + "\n\n" + weave + "\n\n" + origin;
  }

  function render() {
    elName.classList.remove("anim");
    void elName.offsetWidth;
    elName.textContent = last;
    elName.classList.add("anim");

    if (lastShowGenre) {
      elGenreTag.style.display = "";
      elGenreTag.textContent = lastGenre.name + " · " + lastGenre.tagline;
      elGenreTag.classList.add("show");
    } else {
      elGenreTag.classList.remove("show");
      elGenreTag.style.display = "none";
    }

    elBreakdown.innerHTML = "<b>" + lastCombo[0][0] + "</b>・" +
                            "<b>" + lastCombo[1][0] + "</b>・" +
                            "<b>" + lastCombo[2][0] + "</b>";

    elStory.classList.remove("show");
    void elStory.offsetWidth;
    elStory.innerHTML =
      '<span class="story-label">· 关于这个名字 ·</span>' +
      lastStoryPlain.replace(/\n\n/g, '<br><br>') +
      '<span class="story-tip">点击这段介绍可复制完整内容</span>';
    elStory.classList.add("show");
  }

  // ---------- 历史记录 ----------
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveHistory(list) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function pushHistory() {
    var list = loadHistory();
    list = list.filter(function (n) { return n.name !== last; });
    list.unshift({ name: last, genre: lastShowGenre ? lastGenre.name : null, story: lastStoryPlain, combo: lastCombo });
    list = list.slice(0, 15);
    saveHistory(list);
    renderHistory(list);
  }
  function renderHistory(list) {
    elHistory.innerHTML = "";
    list.forEach(function (n) {
      var chip = document.createElement("span");
      chip.className = "chip";
      chip.innerHTML = n.genre ? (n.name + "<small>" + n.genre + "</small>") : n.name;
      chip.title = "点击查看";
      chip.addEventListener("click", function () { restore(n); });
      elHistory.appendChild(chip);
    });
  }
  function restore(n) {
    last = n.name;
    lastShowGenre = !!n.genre;
    lastGenre = GENRES.filter(function (g) { return g.name === n.genre; })[0] || GENRES[0];
    lastStoryPlain = n.story || "";
    if (Array.isArray(n.combo) && n.combo.length === 3) {
      lastCombo = n.combo;
    } else {
      lastCombo = [
        [n.name.slice(0, 2), ""],
        [n.name.slice(2, 4), ""],
        [n.name.slice(4, 6), ""]
      ];
    }
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ---------- 复制 ----------
  function copyText(text, msg) {
    var done = function () { showToast(msg || "已复制"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text); done();
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  var toastTimer;
  function showToast(msg) {
    elToast.textContent = msg;
    elToast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { elToast.classList.remove("show"); }, 1400);
  }

  // ---------- 风格选择 ----------
  function renderGenres() {
    var labels = ["全部"].concat(GENRES.map(function (g) { return g.name; }));
    elGenres.innerHTML = "";
    labels.forEach(function (m) {
      var btn = document.createElement("button");
      btn.className = "genre" + (m === currentGenre ? " active" : "");
      btn.textContent = m;
      btn.addEventListener("click", function () {
        currentGenre = m;
        renderGenres();
        generate();
      });
      elGenres.appendChild(btn);
    });
  }

  // ---------- 事件 ----------
  btnGen.addEventListener("click", generate);
  btnCopy.addEventListener("click", function () { copyText(last, "已复制名字"); });
  elName.addEventListener("click", function () { copyText(last, "已复制名字"); });
  elStory.addEventListener("click", function () {
    copyText(last + "\n\n" + lastStoryPlain, "已复制名字与介绍");
  });
  btnClear.addEventListener("click", function () { saveHistory([]); renderHistory([]); });
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" && document.activeElement !== btnGen) {
      e.preventDefault();
      generate();
    }
  });

  // ---------- 初始化 ----------
  renderGenres();
  renderHistory(loadHistory());
  generate();
})();
